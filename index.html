<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Služební auta — interaktivní školení</title>
  <style>
    :root{--cream:#fff8e9;--navy:#11284a;--blue:#2258f6;--lime:#b9e43c;--coral:#ff6a5b;--white:#fffefa}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--navy);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;color:inherit}button:focus-visible{outline:4px solid #ff9c35;outline-offset:4px}.screen{min-height:100vh;position:relative;overflow:hidden;background:radial-gradient(circle at 28% 14%,#fff 0,transparent 28%),var(--cream)}.top{height:100px;display:flex;align-items:center;justify-content:space-between;padding:0 3.5vw;position:relative;z-index:10}.brand{display:flex;gap:15px;align-items:center;font-size:23px;font-weight:900}.logo{width:52px;height:52px;border-radius:17px;display:grid;place-items:center;color:#fff;background:var(--blue);transform:rotate(30deg);box-shadow:0 10px 24px #2258f633}.logo i{font-style:normal;transform:rotate(-30deg)}.trainer{border:1px solid #9c9a91;background:#fffdf6cc;border-radius:20px;min-height:52px;padding:0 20px;font-weight:800;font-size:17px;cursor:pointer}.trainer b{color:#aaa}.trainer.on b{color:var(--blue)}.hero{position:relative;z-index:5;width:45%;padding:5.5vh 0 0 3.5vw}.eyebrow,.kicker{color:var(--blue);font-size:13px;font-weight:950;letter-spacing:.18em;text-transform:uppercase}.hero h1{font-size:clamp(84px,9vw,148px);line-height:.78;margin:22px 0 34px;letter-spacing:-.085em;font-weight:950}.lead{font-size:clamp(22px,2vw,32px);line-height:1.25;margin:0 0 38px;letter-spacing:-.035em}.primary{border:0;border-radius:22px;background:linear-gradient(135deg,#3670ff,var(--blue));color:#fff;padding:18px 28px;font-weight:900;font-size:22px;cursor:pointer;box-shadow:0 16px 34px #2258f638;transition:.22s}.primary:hover{transform:translateY(-5px)}.primary.big{min-width:340px;height:78px;font-size:26px}.primary.big span{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:#fff;color:var(--blue);margin-right:13px}.chips{display:flex;align-items:center;gap:12px;margin-top:27px;font-weight:850;flex-wrap:wrap}.chips span{background:#fffdf7;border:1px solid #e7dfcf;border-radius:999px;padding:9px 14px;box-shadow:0 8px 18px #16213d0d}.map{position:absolute;width:61vw;height:80vh;right:-2vw;top:14vh;filter:drop-shadow(0 22px 22px #12254720)}.road{position:absolute;background:#30343a;border:14px solid #d8cbb4;box-shadow:inset 0 0 0 3px #f5ead8,0 10px 0 #ad9e88}.road:after{content:"";position:absolute;inset:47% 5%;border-top:5px dashed #fff9e8}.r1{width:78%;height:29%;right:8%;top:16%;border-radius:52% 28% 54% 30%;transform:rotate(8deg)}.r2{width:77%;height:28%;right:3%;bottom:13%;border-radius:30% 65% 40% 55%;transform:rotate(-8deg)}.node{position:absolute;z-index:5;border:8px solid #f8f0df;width:96px;height:96px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:42px;font-weight:950;cursor:pointer;box-shadow:0 13px 0 #17368f,0 18px 25px #15274533;transition:.22s}.node:hover{transform:translateY(-8px) scale(1.04)}.node small{position:absolute;top:108px;font-size:14px;color:var(--navy);background:#fffefa;border-radius:99px;padding:6px 11px}.blue{background:var(--blue)}.lime{background:var(--lime);color:#365500;box-shadow:0 13px 0 #76930f,0 18px 25px #15274533}.coral{background:var(--coral);box-shadow:0 13px 0 #b9362b,0 18px 25px #15274533}.n1{left:21%;bottom:4%}.n2{left:10%;top:35%}.n3{right:17%;bottom:4%}.n4{right:10%;top:35%}.n5{right:36%;top:0}.car{position:absolute;left:2%;bottom:15%;font-size:84px;z-index:6;filter:drop-shadow(0 12px 9px #0003)}.deco{position:absolute;font-size:62px}.tree1{left:28%;top:18%;color:#719b28}.tree2{right:28%;bottom:27%;color:#719b28}.finish{right:40%;top:0;color:var(--blue)}.hint{position:absolute;right:3.5vw;bottom:16px;font-size:11px;font-weight:850;letter-spacing:.08em;opacity:.55}.deck{display:none;min-height:100vh;grid-template-rows:90px 1fr 78px}.deck.active{display:grid}.landing.hidden{display:none}.decktop{height:90px;display:flex;align-items:center;justify-content:space-between;padding:0 3.5vw;border-bottom:1px solid #ded6c8}.compact{font-size:18px;cursor:pointer;border:0;background:transparent}.compact .logo{width:42px;height:42px;border-radius:13px}.progress{display:flex;gap:11px}.progress button{width:41px;height:41px;border:2px solid #d1c9b9;border-radius:50%;background:transparent;font-weight:900;cursor:pointer}.progress .active{background:var(--blue);color:#fff;border-color:var(--blue);transform:scale(1.14)}.progress .done{background:#dfeab8;border-color:#9bbd31;color:#456113}.content{padding:clamp(30px,5vh,58px) 5vw 24px;display:flex;flex-direction:column;justify-content:center;max-width:1600px;width:100%;margin:auto;animation:arrive .45s}.heading{max-width:1100px}.heading h2{font-size:clamp(48px,5vw,78px);line-height:.98;letter-spacing:-.065em;margin:12px 0 18px}.heading>p:last-child{font-size:clamp(20px,1.8vw,29px);margin:0;line-height:1.35}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:4.5vh 0 3.5vh}.facts article{background:#fffefa;border:1px solid #e3dacb;border-radius:25px;padding:24px 28px;box-shadow:0 14px 30px #11284a0a}.facts strong{display:block;font-size:clamp(34px,3vw,50px);letter-spacing:-.055em;color:var(--blue)}.facts span{font-weight:750;font-size:16px}.bottom{display:grid;grid-template-columns:1.35fr .65fr;gap:22px}.takeaway,.note{border-radius:27px;background:var(--navy);color:#fff;padding:25px 29px}.takeaway>p{font-size:11px;letter-spacing:.16em;font-weight:900;opacity:.6;margin:0 0 16px}.takeaway>div{display:flex;align-items:center;gap:16px;font-size:17px;font-weight:750;margin:10px 0}.takeaway b{display:grid;place-items:center;background:var(--blue);width:31px;height:31px;border-radius:50%;font-size:13px}.note{background:var(--white);color:var(--navy);border:2px solid var(--blue);display:flex;align-items:center;gap:20px}.note i{font-style:normal;font-size:52px}.note p{font-size:16px;line-height:1.45;font-weight:650;margin:0}.footer{height:78px;padding:0 3.5vw;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ded6c8;background:#fffaf0}.footer button{border:0;background:transparent;font-weight:900;cursor:pointer;padding:14px 19px;border-radius:15px}.footer span{font-size:12px;font-weight:900;letter-spacing:.18em}.footer .next{background:var(--navy);color:#fff;min-width:210px}.quiz{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:30px 0 22px}.q{background:#fffefa;border:1px solid #ded6c8;border-radius:24px;padding:22px}.q>span{font-weight:950;color:var(--blue);font-size:13px}.q h3{font-size:22px;line-height:1.18;min-height:78px}.answers{display:grid;gap:9px}.answers button{border:1px solid #dad3c6;border-radius:13px;background:#fffaf0;padding:11px;text-align:left;font-weight:700;cursor:pointer}.answers button.correct{background:#dbef9e;border-color:#83ad12}.answers button.wrong{background:#ffd2cc;border-color:#e84f41}.feedback{font-size:13px;line-height:1.4;font-weight:650}.restart{display:none}.restart.show{display:inline-block}@keyframes arrive{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@media(max-width:900px){.map{opacity:.25;width:110vw;right:-30vw}.hero{width:90%}.hero h1{font-size:88px}.trainer{font-size:0}.trainer b{font-size:17px}.facts,.quiz{grid-template-columns:1fr}.bottom{grid-template-columns:1fr}.note{display:none}.content{justify-content:flex-start;overflow:auto}.heading h2{font-size:44px}.facts{margin:22px 0}.progress{gap:4px}.progress button{width:31px;height:31px}.q h3{min-height:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="screen landing" id="landing">
    <header class="top"><div class="brand"><span class="logo"><i>◉</i></span>Služební auta</div><button class="trainer on" id="trainerHome"><b>●</b> Režim školitele &nbsp; 1 / 5</button></header>
    <section class="hero"><p class="eyebrow">INTERAKTIVNÍ ŠKOLENÍ · 35 MIN</p><h1>Služební<br>auta</h1><p class="lead">Jedna cesta. Pět rozhodnutí.<br><strong>Dokážete dojet bez chyby?</strong></p><button class="primary big" id="start"><span>→</span>Vyrazit na cestu</button><div class="chips"><span>▤ Pravidla</span>•<span>● Servis</span>•<span>▲ Nehoda</span>•<span>⚑ Quiz</span></div></section>
    <div class="map" aria-label="Mapa školení s pěti zastávkami"><div class="road r1"></div><div class="road r2"></div><button class="node blue n1" data-step="0">1<small>Převzetí</small></button><button class="node lime n2" data-step="1">2<small>Provoz</small></button><button class="node coral n3" data-step="2">3<small>Peníze</small></button><button class="node blue n4" data-step="3">4<small>Servis</small></button><button class="node blue n5" data-step="4">5<small>Nehoda</small></button><div class="car">🚙</div><div class="deco tree1">♣</div><div class="deco tree2">♣</div><div class="deco finish">⚑</div></div><p class="hint">ŠIPKY = POHYB · MEZERNÍK = DALŠÍ · T = POZNÁMKY</p>
  </main>
  <main class="screen deck" id="deck"><header class="decktop"><button class="brand compact" id="home"><span class="logo"><i>◉</i></span>Služební auta</button><nav class="progress" id="progress"></nav><button class="trainer on" id="trainerDeck"><b>●</b> Školitel</button></header><section class="content" id="content"></section><footer class="footer"><button id="prev">← Zpět</button><span id="counter"></span><button class="next" id="next">Další checkpoint →</button></footer></main>
  <script>
    const chapters=[
      {k:'Checkpoint 1 · Převzetí',t:'Klíčky nejsou automatický nárok.',l:'Než vyjedete, musí být splněné tři základní podmínky.',f:[['ŘP','platný řidičský průkaz'],['≤ 5 let','stáří vstupního školení'],['1× / 2 roky','opakované školení']],b:['Elektronická kniha jízd','Pravidelný Car Report','Podepsaný předávací protokol'],n:'Firma vozidlo poskytuje. Fleet ho spravuje. Ředitel schvaluje. Uživatel odpovídá za jeho stav a správné používání.',i:'🔑'},
      {k:'Checkpoint 2 · Každodenní provoz',t:'Chovejte se k němu jako ke svěřenému majetku.',l:'Čisté, bezpečné, servisované — a se správným režimem GPS.',f:[['0','GPS · služební jízda'],['I','GPS · soukromá jízda'],['0×','kouření ve voze']],b:['Kontrola pneumatik, kapalin a kontrolek','Žádné půjčování nepovoleným osobám','Žádná výdělečná, závodní ani nebezpečná jízda'],n:'Při soukromé jízdě mohou vůz řídit povolení rodinní příslušníci, odpovědnost ale vždy zůstává zaměstnanci.',i:'🛡️'},
      {k:'Checkpoint 3 · Soukromá jízda',t:'Benefit ano. Bez dopadů ne.',l:'Soukromé kilometry se evidují, hradí a vozidlo vstupuje do zdanitelného příjmu.',f:[['1 %','běžný vůz / měsíc'],['0,5 %','hybrid / měsíc'],['0,25 %','elektromobil / měsíc']],b:['Soukromé km přes GPS režim I','Vyúčtování v Car Reportu','Zdanění i při využití jen část měsíce'],n:'Dopad může zahrnout soukromé kilometry, nadlimitní PHM, spoluúčast, škodu či opotřebení. Neexistuje jednotné procento srážky.',i:'◒'},
      {k:'Checkpoint 4 · Servis',t:'Kontrolka není návrh. Je to úkol.',l:'Termíny hlídá řidič, opravy patří do schválené servisní sítě.',f:[['24/7','asistence 605 201 820'],['7 °C','hranice pro přezutí'],['ORV + karta','co vzít do servisu']],b:['Dodržujte servisní plán a STK','Před jízdou kontrolujte základní stav','Po servisu hned ověřte provedené práce'],n:'Letní pneu min. 30 000 km, zimní dle interní směrnice 40 000 km. Předčasné opotřebení může být přeúčtováno.',i:'🔧'},
      {k:'Checkpoint 5 · Nehoda',t:'Zastavit. Zajistit. Zdokumentovat. Nahlásit.',l:'Čtyři kroky, které chrání lidi, vůz i vás.',f:[['158','Policie ČR'],['200 000 Kč','hranice škody pro policii'],['48 h','protokol u krádeže / vandalismu']],b:['Fotky místa, škod, vozidel a dokladů','Záznam podepsaný všemi účastníky','Nahlásit Fleet + SharePoint před opravou'],n:'Policii volejte vždy při zranění, alkoholu, neshodě o vině, zvěři, vandalismu, odcizení nebo škodě třetí osobě.',i:'⚠️'}
    ];
    const qs=[['Soukromou jízdu označím…',['GPS režim 0','GPS režim I','Až zpětně v servisu'],1,'Režim I oddělí soukromé kilometry pro Car Report.'],['Druhý řidič odmítá určit viníka. Co udělám?',['Sepíšu SPZ a odjedu','Zavolám Policii ČR','Nahlásím to při vrácení'],1,'Při neshodě nebo nespolupráci se volá Policie ČR.'],['Kam mohu se služebním vozem na servis?',['Do schválené servisní sítě','Kamkoliv, když si to zaplatím','Jen poblíž sídla'],0,'Servis se řeší jen přes schválené partnery.']];
    let step=0,trainer=true,quiz=false,answers=[];const landing=document.querySelector('#landing'),deck=document.querySelector('#deck'),content=document.querySelector('#content');
    function openDeck(s=0){step=s;quiz=false;landing.classList.add('hidden');deck.classList.add('active');render()}
    function render(){document.querySelector('#progress').innerHTML=chapters.map((_,i)=>`<button class="${!quiz&&i===step?'active':i<step||quiz?'done':''}" data-jump="${i}">${i<step||quiz?'✓':i+1}</button>`).join('');document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>openDeck(+b.dataset.jump));document.querySelector('#counter').textContent=quiz?'FINÁLE':`${String(step+1).padStart(2,'0')} / 05`;document.querySelector('#next').textContent=quiz?'Hotovo':step===4?'Spustit kvíz →':'Další checkpoint →';if(quiz)return renderQuiz();const c=chapters[step];content.innerHTML=`<div class="heading"><p class="kicker">${c.k}</p><h2>${c.t}</h2><p>${c.l}</p></div><div class="facts">${c.f.map(x=>`<article><strong>${x[0]}</strong><span>${x[1]}</span></article>`).join('')}</div><div class="bottom"><div class="takeaway"><p>CO SI ODNÉST</p>${c.b.map((x,i)=>`<div><b>${i+1}</b><span>${x}</span></div>`).join('')}</div><div class="note"><i>${c.i}</i><p>${trainer?c.n:'Stiskněte T nebo zapněte režim školitele pro poznámku k výkladu.'}</p></div></div>`}
    function renderQuiz(){content.innerHTML=`<div class="heading"><p class="kicker">Cílová rovinka · 3 otázky</p><h2>${answers.length===3?`Skóre ${answers.reduce((s,a,i)=>s+(a===qs[i][2]),0)} / 3`:'Řidičský finiš'}</h2><p>Teď už jen ověřit, že cesta zůstala v hlavě.</p></div><div class="quiz">${qs.map((q,qi)=>`<article class="q"><span>0${qi+1}</span><h3>${q[0]}</h3><div class="answers">${q[1].map((o,oi)=>`<button data-q="${qi}" data-a="${oi}" ${answers[qi]!==undefined?'disabled':''} class="${answers[qi]===oi?(oi===q[2]?'correct':'wrong'):''}">${o}</button>`).join('')}</div>${answers[qi]!==undefined?`<p class="feedback">${answers[qi]===q[2]?'Správně. ':'Tady pozor. '}${q[3]}</p>`:''}</article>`).join('')}</div><button class="primary restart ${answers.length===3?'show':''}" id="restart">↻ Projet znovu</button>`;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{answers[+b.dataset.q]=+b.dataset.a;render()});const r=document.querySelector('#restart');if(r)r.onclick=()=>{answers=[];openDeck(0)}}
    function toggleTrainer(){trainer=!trainer;document.querySelectorAll('.trainer').forEach(x=>x.classList.toggle('on',trainer));if(deck.classList.contains('active'))render()}
    document.querySelector('#start').onclick=()=>openDeck(0);document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>openDeck(+b.dataset.step));document.querySelector('#home').onclick=()=>{deck.classList.remove('active');landing.classList.remove('hidden')};document.querySelector('#trainerHome').onclick=toggleTrainer;document.querySelector('#trainerDeck').onclick=toggleTrainer;document.querySelector('#next').onclick=()=>{if(quiz)return;if(step<4){step++;render()}else{quiz=true;render()}};document.querySelector('#prev').onclick=()=>{if(quiz){quiz=false;render()}else if(step>0){step--;render()}else document.querySelector('#home').click()};addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();if(deck.classList.contains('active'))document.querySelector('#next').click();else openDeck(0)}if(e.key==='ArrowLeft'&&deck.classList.contains('active'))document.querySelector('#prev').click();if(e.key.toLowerCase()==='t')toggleTrainer()});
  </script>
</body>
</html>
